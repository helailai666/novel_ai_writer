version: "3.9"

services:
  backend:
    build: ./backend
    container_name: novelai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/novel_ai_writer.db:/app/novel_ai_writer.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: novelai-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
